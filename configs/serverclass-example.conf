# serverclass.conf — example server class definitions for Splunk Deployment Server
# Segments forwarders by role so app/config pushes are targeted, not blanket-pushed
# to every forwarder in the environment.

[global]
whitelist.0=*

[serverClass:linux_web_servers]
whitelist.0=web-*
machineTypes = linux-x86_64

[serverClass:linux_web_servers:app:unix_ta]
restartSplunkd = 1

[serverClass:linux_web_servers:app:web_index_config]
restartSplunkd = 1

[serverClass:windows_domain_controllers]
whitelist.0=dc-*
machineTypes = windows-x64

[serverClass:windows_domain_controllers:app:windows_ta]
restartSplunkd = 1

[serverClass:windows_domain_controllers:app:security_index_config]
restartSplunkd = 1

# Deployment-only class — pushes forwarder monitoring config to every managed
# forwarder regardless of role, useful for fleet-wide health visibility
[serverClass:all_forwarders]
whitelist.0=*

[serverClass:all_forwarders:app:deployment_health_monitoring]
restartSplunkd = 0
